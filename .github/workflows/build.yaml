name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 注意：sln 里的 32 位平台名是 x86（工程内部映射为 Win32）
          # ARM（32 位）已移除：新版 MSVC 工具集不再提供 32 位 ARM 目标
          - platform: x86
            outdir: Release
            artifact: AudioPlaybackConnector32
          - platform: x64
            outdir: x64/Release
            artifact: AudioPlaybackConnector64
          - platform: ARM64
            outdir: ARM64/Release
            artifact: AudioPlaybackConnectorARM64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate translation resources
        shell: bash
        run: |
          set -e
          python -m pip install -r translate/requirements.txt
          (cd translate && ./gen_rc.sh)

      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AudioPlaybackConnector.sln

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Detect PlatformToolset
        id: toolset
        shell: pwsh
        run: |
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
          $dirs = foreach ($root in $roots) {
            Get-ChildItem -Path (Join-Path $root 'Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC') `
              -Directory -ErrorAction SilentlyContinue
          }
          $found = $dirs | Where-Object { $_.Name -match '^v\d+$' } |
            Sort-Object { [int]$_.Name.TrimStart('v') } -Descending
          $t = if ($found) { $found[0].Name } else { 'v143' }
          Write-Host "detected PlatformToolset: $t"
          "toolset=$t" >> $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.platform }}
        run: msbuild AudioPlaybackConnector.sln -nologo -m "-p:Configuration=Release;Platform=${{ matrix.platform }};PlatformToolset=${{ steps.toolset.outputs.toolset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.outdir }}/${{ matrix.artifact }}.exe
            ${{ matrix.outdir }}/${{ matrix.artifact }}.pdb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
