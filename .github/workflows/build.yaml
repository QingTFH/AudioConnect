name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win32
            outdir: Release
            artifact: AudioPlaybackConnector32
          - platform: x64
            outdir: x64/Release
            artifact: AudioPlaybackConnector64
          - platform: ARM
            outdir: ARM/Release
            artifact: AudioPlaybackConnectorARM
          - platform: ARM64
            outdir: ARM64/Release
            artifact: AudioPlaybackConnectorARM64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate translation resources
        shell: bash
        run: |
          set -e
          python -m pip install -r translate/requirements.txt
          (cd translate && ./gen_rc.sh)

      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AudioPlaybackConnector.sln

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.platform }}
        run: msbuild AudioPlaybackConnector.sln -nologo -m "-p:Configuration=Release;Platform=${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.outdir }}/${{ matrix.artifact }}.exe
            ${{ matrix.outdir }}/${{ matrix.artifact }}.pdb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
