name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 注意：sln 里的 32 位平台名是 x86（工程内部映射为 Win32）
          # ARM（32 位）已移除：新版 MSVC 工具集不再提供 32 位 ARM 目标
          - platform: x86
            outdir: Release
            artifact: AudioPlaybackConnector32
          - platform: x64
            outdir: x64/Release
            artifact: AudioPlaybackConnector64
          - platform: ARM64
            outdir: ARM64/Release
            artifact: AudioPlaybackConnectorARM64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate translation resources
        shell: bash
        run: |
          set -e
          python -m pip install -r translate/requirements.txt
          (cd translate && ./gen_rc.sh)

      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AudioPlaybackConnector.sln

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Detect PlatformToolset
        id: toolset
        shell: pwsh
        run: |
          # MSVC 工具集名 (v143/v145...) 与 VS 版本不同步：VS18 上装的仍是 MSVC 14.5x -> v145。
          # 因此从 VC\Tools\MSVC\<x.y.z> 推导：14.51 -> v145，14.39 -> v143。
          function Get-VsInstallPath {
            $vswhere = (Get-Command vswhere -ErrorAction SilentlyContinue).Source
            if (-not $vswhere) {
              $c = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
              if (Test-Path $c) { $vswhere = $c }
            }
            if ($vswhere) {
              $p = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
              if ($p) { return $p.Trim() }
            }
            foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if (-not $root) { continue }
              $vsRoot = Join-Path $root 'Microsoft Visual Studio'
              if (Test-Path $vsRoot) {
                $d = Get-ChildItem -Path $vsRoot -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
                if ($d) { return $d.FullName }
              }
            }
          }

          $vs = Get-VsInstallPath
          Write-Host "VS install path: $vs"
          $t = $null
          if ($vs) {
            # 可用的 PlatformToolset 枚举在 <VS>\MSBuild\Microsoft\VC\<vcVer>\Platforms\<plat>\PlatformToolsets
            $vcRoot = Join-Path $vs 'MSBuild\Microsoft\VC'
            $vcVer = Get-ChildItem -Path $vcRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^v\d+$' } |
              Sort-Object { [int]$_.Name.TrimStart('v') } -Descending | Select-Object -First 1
            if ($vcVer) {
              foreach ($plat in @('x64', 'ARM64', 'Win32')) {
                $ptRoot = Join-Path $vcVer.FullName "Platforms\$plat\PlatformToolsets"
                if (-not (Test-Path $ptRoot)) { continue }
                $d = Get-ChildItem -Path $ptRoot -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match '^v\d+$' } |
                  Sort-Object { [int]$_.Name.TrimStart('v') } -Descending | Select-Object -First 1
                if ($d) {
                  Write-Host "toolsets under $plat : " + ((Get-ChildItem $ptRoot -Directory | ForEach-Object Name) -join ',')
                  $t = $d.Name
                  break
                }
              }
            }
            # 兜底：由 VC\Tools\MSVC 版本推导（14.51 -> v145, 14.39 -> v143）
            if (-not $t) {
              $toolsRoot = Join-Path $vs 'VC\Tools\MSVC'
              if (Test-Path $toolsRoot) {
                $verDir = Get-ChildItem -Path $toolsRoot -Directory -ErrorAction SilentlyContinue |
                  Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
                if ($verDir -and $verDir.Name -match '^(\d+)\.(\d+)') {
                  $t = "v$($Matches[1])$([math]::Floor([int]$Matches[2] / 10))"
                }
              }
            }
          }
          if (-not $t) { $t = 'v143' }
          Write-Host "detected PlatformToolset: $t"
          "toolset=$t" >> $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.platform }}
        run: msbuild AudioPlaybackConnector.sln -nologo -m "-p:Configuration=Release;Platform=${{ matrix.platform }};PlatformToolset=${{ steps.toolset.outputs.toolset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.outdir }}/${{ matrix.artifact }}.exe
            ${{ matrix.outdir }}/${{ matrix.artifact }}.pdb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
